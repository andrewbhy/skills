name: ci

# Runs only when started by hand (Actions tab > ci > Run workflow); exports are tested locally before every push.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: plugins/jig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      # The install test needs the claude CLI; without it the test fails in CI (it only skips on a laptop).
      - run: npm install --global @anthropic-ai/claude-code
      - run: npx playwright-core install chromium
      - run: npm test
      - run: node --test tests/plugin-install.test.mjs
