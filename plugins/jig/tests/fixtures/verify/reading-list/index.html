<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reading list</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 1.125rem/1.5 system-ui, sans-serif; color: #17243a; background: #f4f6fa; }
  main { max-width: 48rem; margin: 3rem auto; padding: 1.5rem; }
  form { display: grid; gap: .75rem; }
  input, button { font: inherit; padding: .75rem; border: 1px solid #526178; border-radius: .3rem; min-width: 0; }
  button { background: #183f7a; color: white; cursor: pointer; }
  #error { color: #9d1021; min-height: 1.5em; margin: 0; }
  li { overflow-wrap: anywhere; margin-block: .5rem; }
</style>
<main>
  <h1>Reading list</h1>
  <form novalidate>
    <label for="title">Title</label>
    <input id="title" name="title" aria-describedby="error" autocomplete="off">
    <button type="submit">Add title</button>
    <p id="error" role="alert"></p>
  </form>
  <h2>Saved titles</h2>
  <ul id="items" aria-live="polite"></ul>
</main>
<script type="module" src="/app.mjs"></script>
</html>
