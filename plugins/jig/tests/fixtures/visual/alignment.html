<!doctype html><meta charset="utf-8"><title>Alignment fixtures</title>
<style>
body{margin:0;font:16px/24px sans-serif}#screen{width:400px;padding:16px;box-sizing:border-box}
#group{display:flex;flex-direction:column;align-items:flex-start;gap:8px;width:320px}#half{border:1px solid}
.peer{width:100px;height:24px}#miss{margin-left:2px}#half{position:fixed;left:16.5px;top:200px;width:24px;height:24px}
#parent{margin-top:16px;padding:8px;width:120px;height:48px;box-sizing:border-box}#overflow{width:140px;height:24px}
.clean #miss{margin-left:0}.clean #half{left:16px}.clean #overflow{width:104px}
</style>
<main id="screen"><div id="group"><div class="peer" id="exact-a">One</div><div class="peer" id="exact-b">Two</div><div class="peer" id="miss">Three</div></div><div id="half"></div><div id="parent"><div id="overflow"></div></div></main>
<script>
window.jigStates = ['broken','clean'].map(name => ({name,
  setup: async () => {document.body.classList.toggle('clean',name==='clean');},
  reset: async () => {document.body.classList.remove('clean');}
}));
</script>
